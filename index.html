<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOCK BUFF</title>
<meta name="description" content="A block puzzle where jokers multiply every line you clear.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg:#141418; --card:#1f1f26; --text:#f2f2f5; --muted:#a8a8b4; --accent:#ffd35c; --accent2:#ff6a3d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
  main { max-width:480px; width:100%; text-align:center; }
  img { width:160px; height:160px; border-radius:36px; }
  h1 { font-size:40px; margin:20px 0 8px; letter-spacing:1px; }
  p { color:var(--muted); font-size:18px; line-height:1.5; margin:0 0 28px; }
  .play { display:inline-block; padding:16px 28px; border-radius:14px; font-weight:700; font-size:18px; color:#1a1206;
          background:linear-gradient(180deg,var(--accent),var(--accent2)); text-decoration:none; }
  footer { margin-top:40px; font-size:14px; }
  footer a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="BLOCK BUFF icon">
  <h1>BLOCK BUFF</h1>
  <p>A block puzzle where jokers multiply every line you clear.</p>
  <a class="play" href="https://play.google.com/store/apps/details?id=com.blockbuff.game">Get it on Google Play</a>
  <footer><a href="https://sites.google.com/view/blockbuff-privacy">Privacy Policy</a></footer>
</main>
</body>
</html>
